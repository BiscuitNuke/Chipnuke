# Per-address limit for the api. Caddy sends the visitor address in X-Forwarded-For.
limit_req_zone $binary_remote_addr zone=api:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=admin:1m rate=60r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Trust the address from the gateway only on private networks.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Moderation API for HamBot. Only for direct LAN requests: the gateway always adds
    # X-Forwarded-For, so anything that came in from the internet gets a 404 here.
    location /api/admin/ {
        if ($http_x_forwarded_for) {
            return 404;
        }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:8081;
        limit_req zone=admin burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass $api;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The api service. Resolved at request time, so nginx starts without it.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api http://api:8081;
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_pass $api;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location ^~ /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~ /\. {
        deny all;
    }
}
