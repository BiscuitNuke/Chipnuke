name: Build chipnuke

on:
  push:
    branches: [main]
    paths-ignore: ['deploy/compose.yaml', '**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chipnuke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify export
        run: test -s out/index.html && test -s out/404.html
      - name: Check api syntax
        run: python3 -m py_compile api/api.py
      - name: Leak scan
        run: |
          if grep -rEn "10\.[0-9]+\.[0-9]+\.[0-9]+|192\.168\.[0-9.]+|VLAN ?[0-9]+|raskal-(gw|idp|jump|amp)|:808[0-9]" out --include=*.html; then
            echo 'Internal detail found in the export.'; exit 1
          fi
      - name: Package and smoke test containers
        run: |
          docker build --pull -f deploy/Dockerfile -t chipnuke-check .
          bash deploy/smoke-container.sh chipnuke-check
      - uses: actions/upload-artifact@v7
        with:
          name: chipnuke-preview-${{ github.run_id }}
          path: out/
          retention-days: 7

  publish-image:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify export
        run: test -s out/index.html && test -s out/404.html
      - name: Identify source
        id: source
        shell: bash
        run: |
          source_sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$source_sha" = "$remote_sha" || { echo 'Main advanced; refusing stale image promotion.'; exit 1; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:sha-$source_sha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Package validated export
        run: docker build --pull -f deploy/Dockerfile -t chipnuke-check .
      - name: Smoke test hardened containers
        run: bash deploy/smoke-container.sh chipnuke-check
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable source image
        env:
          IMAGE: ${{ steps.source.outputs.image }}
        run: |
          docker tag chipnuke-check "$IMAGE"
          docker push "$IMAGE"
      - name: Pin image for Dockhand
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$SOURCE_SHA" = "$remote_sha" || { echo 'Main advanced; refusing stale deployment pin.'; exit 1; }
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          path = Path('deploy/compose.yaml')
          text = path.read_text()
          text, count = re.subn(r'(?m)^(\s*image: (?:&image )?)ghcr\.io/biscuitnuke/chipnuke:[^\s]+', lambda m: m[1] + os.environ['IMAGE'], text)
          if count != 1:
              raise SystemExit('Expected exactly one chipnuke image')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/compose.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Pin chipnuke image to $SOURCE_SHA [skip ci]"
          git push origin HEAD:main
